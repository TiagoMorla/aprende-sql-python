{t:"Crear tablas y claves",e:"<code>CREATE TABLE</code> crea una tabla con sus columnas y tipos (<code>INTEGER</code>, <code>TEXT</code>...). <code>PRIMARY KEY</code> identifica cada fila de forma única, <code>NOT NULL</code> obliga a tener valor y <code>REFERENCES tabla(columna)</code> crea una clave foránea que enlaza con otra tabla.",ej:"CREATE TABLE equipos (\n  id INTEGER PRIMARY KEY,\n  nombre TEXT NOT NULL\n);",tb:["jugadores","videojuegos"],ex:[

E("Crea la tabla equipos con id (INTEGER, clave primaria) y nombre (TEXT).","CREATE TABLE equipos (id INTEGER PRIMARY KEY, nombre TEXT)","Forma: <code>CREATE TABLE equipos (id INTEGER PRIMARY KEY, nombre TEXT);</code>",null,{chk:CT("equipos")}),

{t:"GROUP BY",e:"<code>GROUP BY</code> agrupa las filas que tienen el mismo valor y permite usar funciones de agregación por grupo. Cada columna del SELECT debe estar en el GROUP BY o dentro de una función como COUNT o SUM.",ej:"SELECT genero, COUNT(*)\nFROM videojuegos\nGROUP BY genero;",ex:[
E("Muestra cada género y cuántos juegos tiene.","SELECT genero, COUNT(*) FROM videojuegos GROUP BY genero","Agrupa por la columna que quieres separar: <code>GROUP BY genero</code>.","SELECT genero, COUNT(*)\nFROM videojuegos\nGROUP BY ___;"),
E("Muestra cada género y el precio promedio de sus juegos.","SELECT genero, AVG(precio) FROM videojuegos GROUP BY genero","<code>AVG(precio)</code> se calcula por cada grupo.","SELECT genero, ___(precio)\nFROM videojuegos\nGROUP BY genero;"),
E("Muestra cada año y cuántos juegos de más de 20 salieron.","SELECT anio, COUNT(*) FROM videojuegos WHERE precio > 20 GROUP BY anio","<code>WHERE</code> filtra antes de agrupar y <code>GROUP BY anio</code> agrupa el resultado.","SELECT anio, COUNT(*)\nFROM videojuegos\nWHERE precio > 20\nGROUP BY ___;"),
E("Muestra cada género y el precio más alto de sus juegos.","SELECT genero, MAX(precio) FROM videojuegos GROUP BY genero","<code>SELECT genero, MAX(precio) ... GROUP BY genero</code>."),
E("Muestra cada país de la tabla jugadores y cuántos jugadores tiene.","SELECT pais, COUNT(*) FROM jugadores GROUP BY pais","Agrupa por <code>pais</code> y cuenta con <code>COUNT(*)</code>.",null,{tb:["jugadores"]}),
E("Muestra cada género con la suma de precios de los juegos lanzados desde 2019, de la suma más alta a la más baja.","SELECT genero, SUM(precio) FROM videojuegos WHERE anio >= 2019 GROUP BY genero ORDER BY SUM(precio) DESC","El orden es: <code>WHERE</code>, <code>GROUP BY</code> y al final <code>ORDER BY</code>."),

{t:"HAVING",e:"<code>WHERE</code> filtra filas antes de agrupar. <code>HAVING</code> filtra los grupos ya calculados (por ejemplo, con COUNT, SUM o AVG) y va después del <code>GROUP BY</code>.",ej:"SELECT genero, SUM(precio)\nFROM videojuegos\nGROUP BY genero\nHAVING SUM(precio) > 70;",ex:[

E("Muestra los géneros cuyo precio promedio sea mayor a 40.","SELECT genero, AVG(precio) FROM videojuegos GROUP BY genero HAVING AVG(precio) > 40","<code>HAVING AVG(precio) &gt; 40</code> deja solo los grupos que cumplen.","SELECT genero, AVG(precio)\nFROM videojuegos\nGROUP BY genero\nHAVING AVG(precio) ___ 40;"),
E("Muestra los jugador_id con 3 partidas o más.","SELECT jugador_id, COUNT(*) FROM partidas GROUP BY jugador_id HAVING COUNT(*) >= 3","<code>HAVING COUNT(*) &gt;= 3</code> filtra por la cantidad de filas de cada grupo.","SELECT jugador_id, COUNT(*)\nFROM partidas\nGROUP BY jugador_id\nHAVING COUNT(*) >= ___;",{tb:["partidas"]}),
E("Muestra los géneros cuyo precio total supere 100, con su suma.","SELECT genero, SUM(precio) FROM videojuegos GROUP BY genero HAVING SUM(precio) > 100","Agrupa por género y filtra con <code>HAVING SUM(precio) &gt; 100</code>."),
E("Muestra los jugador_id con puntaje total mayor a 250, con su suma de puntos.","SELECT jugador_id, SUM(puntos) FROM partidas GROUP BY jugador_id HAVING SUM(puntos) > 250","<code>HAVING SUM(puntos) &gt; 250</code> después del <code>GROUP BY</code>.",null,{tb:["partidas"]}),
E("Entre los juegos lanzados desde 2019, muestra los géneros con más de 1 juego y cuántos tienen.","SELECT genero, COUNT(*) FROM videojuegos WHERE anio >= 2019 GROUP BY genero HAVING COUNT(*) > 1","<code>WHERE</code> filtra las filas primero y <code>HAVING</code> filtra los grupos después."),
E("Muestra los juego_id con promedio de puntos mayor a 100 (AVG(puntos)), del mayor promedio al menor.","SELECT juego_id, AVG(puntos) FROM partidas GROUP BY juego_id HAVING AVG(puntos) > 100 ORDER BY AVG(puntos) DESC","Orden: <code>GROUP BY</code>, <code>HAVING</code> y al final <code>ORDER BY</code>.",null,{tb:["partidas"]})]},
{t:"INNER JOIN",e:"<code>JOIN</code> une filas de dos tablas con una condición en <code>ON</code>, normalmente clave foránea = clave primaria. <code>INNER JOIN</code> muestra solo las filas que tienen pareja en las dos tablas. Los alias de tabla (<code>j</code>, <code>p</code>) ayudan a escribir menos.",ej:"SELECT j.nombre, p.puntos\nFROM jugadores j\nINNER JOIN partidas p ON j.id = p.jugador_id;",tb:["jugadores","partidas"],ex:[

E("Escribe la consulta que muestre el nombre de cada jugador y los puntos de sus partidas.","SELECT j.nombre, p.puntos FROM jugadores j INNER JOIN partidas p ON j.id = p.jugador_id","<code>FROM jugadores j INNER JOIN partidas p ON j.id = p.jugador_id</code>."),
E("Muestra el título de cada juego y los puntos de sus partidas.","SELECT v.titulo, p.puntos FROM videojuegos v INNER JOIN partidas p ON v.id = p.juego_id","Une <code>videojuegos</code> con <code>partidas</code> por <code>v.id = p.juego_id</code>.",null,{tb:["videojuegos","partidas"]}),
E("Muestra el nombre del jugador y los puntos de las partidas de más de 100 puntos, de mayor a menor puntos.","SELECT j.nombre, p.puntos FROM jugadores j INNER JOIN partidas p ON j.id = p.jugador_id WHERE p.puntos > 100 ORDER BY p.puntos DESC","Después del JOIN van <code>WHERE</code> y <code>ORDER BY</code>."),

/* ---------- SQL ---------- */
function norm(q){return q.toLowerCase().replace(/;/g,"").replace(/\s+/g," ").replace(/\s*([,=<>])\s*/g,"$1").replace(/"/g,"'").trim()}
function fmt(s){return s.replace(/ (FROM|WHERE|GROUP BY|ORDER BY|LIMIT|SET|VALUES) /g,"\n$1 ")+";"}
function sqlLint(q){
 var s=q.replace(/'[^']*'/g,"''");
 if((q.match(/'/g)||[]).length%2)return"Falta cerrar una comilla simple (') en un texto.";
 if(!/\bselect\b/i.test(s))return null;
 if(!/\bfrom\b/i.test(s))return"Falta la cláusula FROM con el nombre de la tabla.";
 var m=s.match(/\bselect\s+([\s\S]*?)\s+from\b/i);
 if(m){var it=m[1].split(","),i,w;for(i=0;i<it.length;i++){w=it[i].trim().split(/\s+/);if(w[0].toUpperCase()=="DISTINCT")w.shift();if(w.length>1&&/^\w+$/.test(w[0])&&/^[A-Za-z_]\w*$/.test(w[1])&&!/^as$/i.test(w[1]))return"Falta una coma entre «"+w[0]+"» y «"+w[1]+"». Las columnas se separan con coma."}}
 return null}
function sqlTr(m){var a;if(a=m.match(/no such column: (.+)/))return"La columna «"+a[1]+"» no existe. Si es un texto, ponlo entre comillas simples.";if(a=m.match(/no such table: (.+)/))return"La tabla «"+a[1]+"» no existe. Revisa el nombre.";if(a=m.match(/near "(.*)": syntax error/))return"Error de sintaxis cerca de «"+a[1]+"». Revisa las comas, las palabras clave y el orden de la consulta.";if(/incomplete input/.test(m))return"La consulta está incompleta.";return"Error de SQL: "+m}
function fx(q){return q.replace(/\bILIKE\b/gi,"LIKE")}
function newDb(){var d=new SQLJS.Database();d.run(SEED);return d}
function runOn(d,q){var r=d.exec(fx(q));return r.length?r[0]:{columns:[],values:[]}}
function run(q){return runOn(db,q)}
function expected(x){if(x.chk){var b=newDb();b.run(fx(x.sol));return runOn(b,x.chk)}return run(x.sol)}
function rows(r,x){var v=r.values;return JSON.stringify(/\border\s+by\b/i.test(x.sol)?v:v.slice().sort(function(a,b){return JSON.stringify(a)<JSON.stringify(b)?-1:1}))}
function checkSql(q,x){
 var le=sqlLint(q);if(le)return{ok:false,err:le};
 if(db){try{
  var a=newDb(),b=newDb(),r1,r2;
  if(x.chk){a.run(fx(q));b.run(fx(x.sol));r1=runOn(a,x.chk);r2=runOn(b,x.chk);return{ok:JSON.stringify(r1)==JSON.stringify(r2)}}
  r1=runOn(a,q);r2=runOn(b,x.sol);
  return{ok:rows(r1,x)==rows(r2,x)&&r1.columns.length==r2.columns.length&&(!x.names||r1.columns.join().toLowerCase()==r2.columns.join().toLowerCase())}}catch(e){return{ok:false,err:sqlTr(e.message)}}}
 return{ok:norm(q)==norm(x.sol)}}
/* ---------- Python ---------- */
function nz(c){return c.replace(/\r/g,"").split("\n").map(function(l){var i=/^\s+/.test(l)?"~":"";return i+l.trim().replace(/"/g,"'").replace(/\s*(==|!=|>=|<=|\+=|-=|=|\+|-|\*|\/|%|>|<|,)\s*/g,"$1")}).filter(function(l){return l.replace("~","")}).join("\n")}
function pyLint(c){
 var L=c.split("\n"),i,t,s=c.replace(/"[^"]*"/g,'""');
 if((s.match(/"/g)||[]).length%2)return'Falta cerrar unas comillas (").';
 s=s.replace(/'[^']*'/g,"''");if((s.match(/'/g)||[]).length%2)return"Falta cerrar unas comillas (').";
 if((c.match(/\(/g)||[]).length!=(c.match(/\)/g)||[]).length)return"Los paréntesis no coinciden: falta abrir o cerrar uno.";
 if((c.match(/\[/g)||[]).length!=(c.match(/\]/g)||[]).length)return"Los corchetes no coinciden: falta abrir o cerrar uno.";
 for(i=0;i<L.length;i++){t=L[i].trim();
  if(/^print\s+[^(\s]/.test(t))return"En Python print lleva paréntesis: print(...).";
  if(/^(if|elif|else|for|while|def)\b/.test(t)){
   if(!/:\s*$/.test(t))return"Falta el signo : al final de «"+t+"».";
   var nx=L.slice(i+1).filter(function(x){return x.trim()})[0];
   if(!nx||!/^\s/.test(nx))return"Después de «"+t+"» el bloque debe ir con sangría (unos espacios al inicio de la línea).";}
  if(/^(if|elif)\b/.test(t)&&/[^=<>!]=[^=]/.test(t.replace(/"[^"]*"|'[^']*'/g,"")))return"Para comparar se usa == (un solo = guarda un valor).";}
 return null}
function pyTr(m){var l=m.trim().split("\n").pop(),a;if(a=l.match(/NameError: name '(.+)' is not defined/))return"La variable «"+a[1]+"» no existe: revisa el nombre o créala antes de usarla.";if(/IndentationError/.test(l))return"Error de sangría: revisa los espacios al inicio de las líneas.";if(/SyntaxError/.test(l))return"Error de sintaxis: "+l;return"Error: "+l}
function runPy(code){var buf=[],err=null;py.setStdout({batched:function(s){buf.push(s)}});try{py.runPython(code,{globals:py.toPy({})})}catch(e){err=String(e.message||e)}return{out:buf.join("\n"),err:err}}
function checkPy(c,x){
 var le=pyLint(c);if(le)return{ok:false,err:le};
 if(pyS==2){var r=runPy(c);if(r.err)return{ok:false,err:pyTr(r.err)};return{ok:r.out.trim()==x.out.trim(),got:r.out}}
 if(pyS==3){var n=nz(c);return{ok:x.sols.some(function(s){return nz(s)==n})}}
 return{wait:1}}

/* ---------- Pantallas ---------- */
function day(d){return Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5)}

function xp(){var n=0;["sql","py"].forEach(function(t){for(var k in P[t])n+=P[t][k]*10});return n}
function hud(){return'<div class="hud"><div class="ava">'+(S.t=="py"?"🐍":"🗄️")+'</div><div class="chip">🔥 '+streak()+'</div><div class="chip">⭐ '+xp()+'</div><div class="chip">'+(S.t?TR[S.t].n:"")+"</div></div>"}

function curI(t){var F=flat(t),i;for(i=0;i<F.length;i++)if(done(t,F[i].k)<F[i].x.ex.length)return i;return F.length-1}

 var a=document.getElementById("app"),h="",t,F,c;
 if(S.v=="auth"){
  h='<div class="logo">SQL<br>&amp;<br>PYTHON</div><p class="blink">▶ PRESIONA START ◀</p><div class="card"><input id="em" class="f" type="email" placeholder="Correo" autocomplete="email" autocapitalize="off"><input id="pw" class="f" type="password" placeholder="Contraseña (mínimo 6)" autocomplete="current-password"><button class="btn" onclick="login()">▶ ENTRAR</button><button class="btn ghost" onclick="signup()">CREAR CUENTA</button>'+(msg?'<div class="fb bad"><p>'+esc(msg)+"</p></div>":"")+(sb?"":'<div class="fb bad"><p>No se pudo cargar el login. Revisa tu conexión.</p></div>')+"</div>";
 }else if(S.v=="tracks"){
  h=hud()+"<h1>ELIGE TU CURSO</h1>";
  ["sql","py"].forEach(function(t){var F=flat(t),n=0,tot=0;F.forEach(function(f){n+=Math.min(done(t,f.k),f.x.ex.length);tot+=f.x.ex.length});
   h+='<button class="tcard" onclick="openTrack(\''+t+'\')"><span class="ic">'+TR[t].c+'</span><span style="flex:1"><b>'+TR[t].n+'</b><br><span class="mut">'+TR[t].d+'</span><div class="pb"><i style="width:'+(tot?n/tot*100:0)+'%"></i></div><span class="mut">'+n+" / "+tot+" ejercicios</span></span></button>"});
  h+=nav();
 }else if(S.v=="profile"){
  h=hud()+'<h1>JUGADOR</h1><div class="card"><p>'+esc(U.email)+"</p><p>⭐ "+xp()+" XP</p><p>🔥 Racha: "+streak()+' días</p></div><button class="btn ghost" onclick="logout()">SALIR</button>'+nav();
 }else if(S.v=="path"){
  F=flat(S.t);c=0;var cur=curI(S.t),ct=F[cur],off=[0,36,56,36,0,-36,-56,-36];
  h=hud()+'<div class="ban"><div><small>'+TR[S.t].L[ct.l].n.toUpperCase()+" · TEMA "+(cur+1)+"</small><b>"+ct.x.t+'</b></div><button class="bk" onclick="openT('+cur+')">📖</button></div>';
  TR[S.t].L.forEach(function(L,li){h+='<div class="lvb lv'+li+'">NIVEL '+(li+1)+" · "+L.n.toUpperCase()+"</div>";
   if(!L.T.length){h+='<p class="soon">PRÓXIMAMENTE…</p>';return}
   h+='<div class="path">';
   L.T.forEach(function(T){var i=c++,k=F[i].k,d=done(S.t,k)>=T.ex.length,u=unlocked(S.t,i),isC=i==cur&&!d;
    h+='<div class="nd" style="transform:translateX('+off[i%8]+'px)">'+(isC?'<div class="go">¡EMPIEZA!</div>':"")+'<button class="dot'+(d?" done":isC?" cur":u?"":" lock")+'" '+(u?'onclick="openT('+i+')"':"disabled")+">"+(d?"★":u?i+1:"🔒")+'</button><div class="cap">'+T.t+"<br><small>"+Math.min(done(S.t,k),T.ex.length)+"/"+T.ex.length+"</small></div></div>"});
   var all=L.T.every(function(T,j){return done(S.t,li+"-"+j)>=T.ex.length});
   h+='<div class="nd"><div class="chest'+(all?" open":"")+'">'+(all?"🎁":"📦")+"</div></div></div>"});
  h+=nav();
 }else if(S.v=="lesson"){t=TP().x;
  h='<div class="top"><button class="back" onclick="go(\'path\')">←</button><h2 style="margin:0">'+t.t+'</h2></div><div class="card"><p>'+t.e+'</p><p class="mut">Ejemplo:</p><pre>'+hl(t.ej)+"</pre>"+(S.t=="py"?'<p class="mut">Salida:</p><pre>'+esc(t.out)+"</pre>":"")+"</div>"+(S.t=="sql"?ver():"")+'<button class="btn" onclick="startEx()">Empezar ejercicios</button>';
 }else if(S.v=="ex"){t=TP().x;var x=t.ex[S.e];
  h='<div class="top"><button class="back" onclick="go(\'path\')">✕</button><div class="bar"><i style="width:'+(S.e/t.ex.length*100)+'%"></i></div></div><h2>'+x.p+"</h2>"+(S.t=="sql"?ver():'<p class="mut">Salida esperada:</p><pre>'+esc(x.out)+'</pre><p id="pyst" class="mut"></p>');
  if(x.tpl){h+='<div class="card q">'+x.tpl.split("\n").map(function(ln){return"<div>"+ln.split("___").map(function(p,j,A){return hl(p)+(j<A.length-1?'<span class="inl"><pre class="hl"></pre><input class="blank" autocomplete="off" autocapitalize="off" spellcheck="false" oninput="sync(this)"></span>':"")}).join("")+"</div>"}).join("")+"</div>"}
  else h+='<div class="ed"><pre class="hl"></pre><textarea id="in" placeholder="'+(S.t=="sql"?"Escribe tu consulta SQL (el ; final es opcional)":"Escribe tu código Python (usa espacios para la sangría)")+'" autocapitalize="off" spellcheck="false" oninput="sync(this)" onscroll="this.previousSibling.scrollTop=this.scrollTop"></textarea></div>';
  if(S.t=="sql"&&db&&!x.tpl){var e=expected(x);h+='<p class="mut">'+(x.chk?"Así debe quedar la tabla:":"Resultado esperado:")+"</p>"+tbl(e.columns,e.values)}

function comprobar(){
 var t=TP(),x=t.x.ex[S.e],Fs=[].slice.call(document.querySelectorAll("#in,.blank")),vs=Fs.map(function(i){return i.value});
 if(vs.some(function(v){return!v.trim()}))return;
 var k=0,c=x.tpl?x.tpl.replace(/___/g,function(){return vs[k++].trim()}):vs[0],f=document.getElementById("fb"),b=document.getElementById("go"),r=S.t=="sql"?checkSql(c,x):checkPy(c,x);
 if(r.wait){f.innerHTML='<div class="fb bad"><p>Python todavía está cargando. Espera unos segundos e inténtalo de nuevo.</p></div>';return}
 Fs.forEach(function(i){i.disabled=true});
 if(r.ok){f.innerHTML='<div class="fb ok"><strong>¡CORRECTO!</strong>'+(done(S.t,t.k)<=S.e?'<span class="xp">+10 XP</span>':"")+'<p>'+x.why+"</p></div>";b.textContent="Continuar";b.onclick=next;
  bump();if(done(S.t,t.k)<=S.e)saveP(S.t,t.k,S.e+1)}
 else{f.innerHTML='<div class="fb bad shake"><strong>'+(r.err?"Tu código tiene un error":"Todavía no")+"</strong>"+(r.err?"<p>"+esc(r.err)+"</p>":"")+(r.got!=null&&!r.err?"<p>Tu código mostró:</p><pre>"+esc(r.got||"(nada)")+"</pre>":"")+"<p>Respuesta correcta:</p><pre>"+hl(S.t=="sql"?fmt(x.sol):x.sols[0])+"</pre><p>"+x.why+"</p><p>Inténtalo de nuevo.</p></div>";b.textContent="Intentar de nuevo";b.onclick=function(){Fs.forEach(function(i){i.disabled=false;i.value="";sync(i)});f.innerHTML="";b.textContent="Comprobar";b.onclick=comprobar;Fs[0].focus()}}
