function norm(q){return q.toLowerCase().replace(/;/g,"").replace(/\s+/g," ").replace(/\s*([,=<>])\s*/g,"$1").replace(/"/g,"'").trim()}
function run(q){var r=db.exec(q);return r.length?r[0]:{columns:[],values:[]}}
function fmt(s){return s.replace(/ (FROM|WHERE|GROUP BY|ORDER BY|LIMIT) /g,"\n$1 ")+";"}
function sqlLint(q){
 var s=q.replace(/'[^']*'/g,"''");
 if((q.match(/'/g)||[]).length%2)return"Falta cerrar una comilla simple (') en un texto.";
 if(!/\bselect\b/i.test(s))return null;
 if(!/\bfrom\b/i.test(s))return"Falta la cláusula FROM con el nombre de la tabla.";
 var m=s.match(/\bselect\s+([\s\S]*?)\s+from\b/i);
 if(m){var it=m[1].split(","),i,w;for(i=0;i<it.length;i++){w=it[i].trim().split(/\s+/);if(w[0].toUpperCase()=="DISTINCT")w.shift();if(w.length>1&&!/^as$/i.test(w[1]))return"Falta una coma entre «"+w[0]+"» y «"+w[1]+"». Las columnas se separan con coma."}}
 return null}
function sqlTr(m){var a;if(a=m.match(/no such column: (.+)/))return"La columna «"+a[1]+"» no existe. Si es un texto, ponlo entre comillas simples.";if(a=m.match(/no such table: (.+)/))return"La tabla «"+a[1]+"» no existe. Revisa el nombre.";if(a=m.match(/near "(.*)": syntax error/))return"Error de sintaxis cerca de «"+a[1]+"». Revisa las comas, las palabras clave y el orden de la consulta.";if(/incomplete input/.test(m))return"La consulta está incompleta.";return"Error de SQL: "+m}
function checkSql(q,x){
 var le=sqlLint(q);if(le)return{ok:false,err:le};
 if(db){try{var a=run(q),b=run(x.sol);return{ok:JSON.stringify(a.values)==JSON.stringify(b.values)&&a.columns.length==b.columns.length}}catch(e){return{ok:false,err:sqlTr(e.message)}}}
 return{ok:norm(q)==norm(x.sol)}}
/* ---------- Python ---------- */
function nz(c){return c.replace(/\r/g,"").split("\n").map(function(l){var i=/^\s+/.test(l)?"~":"";return i+l.trim().replace(/"/g,"'").replace(/\s*(==|!=|>=|<=|\+=|-=|=|\+|-|\*|\/|%|>|<|,)\s*/g,"$1")}).filter(function(l){return l.replace("~","")}).join("\n")}
function pyLint(c){
 var L=c.split("\n"),i,t,s=c.replace(/"[^"]*"/g,'""');
 if((s.match(/"/g)||[]).length%2)return'Falta cerrar unas comillas (").';
 s=s.replace(/'[^']*'/g,"''");if((s.match(/'/g)||[]).length%2)return"Falta cerrar unas comillas (').";
 if((c.match(/\(/g)||[]).length!=(c.match(/\)/g)||[]).length)return"Los paréntesis no coinciden: falta abrir o cerrar uno.";
 if((c.match(/\[/g)||[]).length!=(c.match(/\]/g)||[]).length)return"Los corchetes no coinciden: falta abrir o cerrar uno.";
 for(i=0;i<L.length;i++){t=L[i].trim();
  if(/^print\s+[^(\s]/.test(t))return"En Python print lleva paréntesis: print(...).";
  if(/^(if|elif|else|for|while|def)\b/.test(t)){
   if(!/:\s*$/.test(t))return"Falta el signo : al final de «"+t+"».";
   var nx=L.slice(i+1).filter(function(x){return x.trim()})[0];
   if(!nx||!/^\s/.test(nx))return"Después de «"+t+"» el bloque debe ir con sangría (unos espacios al inicio de la línea).";}
  if(/^(if|elif)\b/.test(t)&&/[^=<>!]=[^=]/.test(t.replace(/"[^"]*"|'[^']*'/g,"")))return"Para comparar se usa == (un solo = guarda un valor).";}
 return null}
function pyTr(m){var l=m.trim().split("\n").pop(),a;if(a=l.match(/NameError: name '(.+)' is not defined/))return"La variable «"+a[1]+"» no existe: revisa el nombre o créala antes de usarla.";if(/IndentationError/.test(l))return"Error de sangría: revisa los espacios al inicio de las líneas.";if(/SyntaxError/.test(l))return"Error de sintaxis: "+l;return"Error: "+l}
function runPy(code){var buf=[],err=null;py.setStdout({batched:function(s){buf.push(s)}});try{py.runPython(code,{globals:py.toPy({})})}catch(e){err=String(e.message||e)}return{out:buf.join("\n"),err:err}}
function checkPy(c,x){
 var le=pyLint(c);if(le)return{ok:false,err:le};
 if(pyS==2){var r=runPy(c);if(r.err)return{ok:false,err:pyTr(r.err)};return{ok:r.out.trim()==x.out.trim(),got:r.out}}
 if(pyS==3){var n=nz(c);return{ok:x.sols.some(function(s){return nz(s)==n})}}
 return{wait:1}}
function pyMsg(){var e=document.getElementById("pyst");if(e)e.textContent=pyS==1?"Cargando Python… (la primera vez tarda unos segundos)":pyS==3?"No se pudo cargar Python: se comprueba comparando el texto.":""}
function loadPy(){if(pyS)return;pyS=1;var s=document.createElement("script");s.src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js";s.onload=function(){loadPyodide().then(function(p){py=p;pyS=2;pyMsg()}).catch(function(){pyS=3;pyMsg()})};s.onerror=function(){pyS=3;pyMsg()};document.head.appendChild(s)}
/* ---------- Sesión y progreso ---------- */
function es(m){if(/Invalid login/i.test(m))return"Correo o contraseña incorrectos.";if(/already registered/i.test(m))return"Ese correo ya tiene una cuenta.";if(/at least 6/i.test(m))return"La contraseña debe tener al menos 6 caracteres.";if(/valid email|invalid format/i.test(m))return"Escribe un correo válido.";return m}
function authUI(msg){S.v="auth";render(msg)}
function cred(){return{email:document.getElementById("em").value.trim(),password:document.getElementById("pw").value}}
function login(){if(!sb)return;sb.auth.signInWithPassword(cred()).then(function(r){if(r.error)authUI(es(r.error.message));else start(r.data.user)})}

function logout(){sb.auth.signOut().then(function(){U=null;P={sql:{},py:{}};authUI()})}
function start(u){U=u;P={sql:{},py:{}};sb.from("progress").select("track,topic_key,done").then(function(r){(r.data||[]).forEach(function(w){if(P[w.track])P[w.track][w.topic_key]=w.done});S={v:"tracks"};render()})}
function saveP(t,k,n){P[t][k]=n;if(sb&&U)sb.from("progress").upsert({user_id:U.id,track:t,topic_key:k,done:n,updated_at:new Date().toISOString()},{onConflict:"user_id,track,topic_key"}).then(function(r){if(r.error)console.error(r.error)})}
/* ---------- Pantallas ---------- */
function day(d){return Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5)}
function stg(){try{return JSON.parse(localStorage.getItem("st")||"{}")}catch(e){return{}}}
function streak(){var s=stg();return s.l&&day(new Date())-s.l>1?0:(s.n||0)}
function bump(){try{var s=stg(),d=day(new Date());if(s.l!=d){s.n=(s.l&&d-s.l==1?s.n:0)+1;s.l=d;localStorage.setItem("st",JSON.stringify(s))}}catch(e){}}
function xp(){var n=0;["sql","py"].forEach(function(t){for(var k in P[t])n+=P[t][k]*10});return n}
function hud(){return'<div class="hud"><div class="ava">'+(S.t=="py"?"🐍":"🗄️")+'</div><div class="chip">🔥 '+streak()+'</div><div class="chip">⭐ '+xp()+'</div><div class="chip">'+(S.t?TR[S.t].n:"")+"</div></div>"}
function nav(){var v=S.v;return'<nav class="nav"><button class="'+(v=="path"?"on":"")+'" onclick="S.t=S.t||\'sql\';go(\'path\')">🗺️<span>MAPA</span></button><button class="'+(v=="tracks"?"on":"")+'" onclick="go(\'tracks\')">🎮<span>CURSOS</span></button><button class="'+(v=="profile"?"on":"")+'" onclick="go(\'profile\')">👤<span>PERFIL</span></button></nav>'}
function curI(t){var F=flat(t),i;for(i=0;i<F.length;i++)if(done(t,F[i].k)<F[i].x.ex.length)return i;return F.length-1}
function render(msg){
 var a=document.getElementById("app"),h="",t,F,c;
 if(S.v=="auth"){
  h='<div class="logo">SQL<br>&amp;<br>PYTHON</div><p class="blink">▶ PRESIONA START ◀</p><div class="card"><input id="em" class="f" type="email" placeholder="Correo" autocomplete="email" autocapitalize="off"><input id="pw" class="f" type="password" placeholder="Contraseña (mínimo 6)" autocomplete="current-password"><button class="btn" onclick="login()">▶ ENTRAR</button><button class="btn ghost" onclick="signup()">CREAR CUENTA</button>'+(msg?'<div class="fb bad"><p>'+esc(msg)+"</p></div>":"")+(sb?"":'<div class="fb bad"><p>No se pudo cargar el login. Revisa tu conexión.</p></div>')+"</div>";
 }else if(S.v=="tracks"){
  h=hud()+"<h1>ELIGE TU CURSO</h1>";
  ["sql","py"].forEach(function(t){var F=flat(t),n=0,tot=0;F.forEach(function(f){n+=Math.min(done(t,f.k),f.x.ex.length);tot+=f.x.ex.length});
   h+='<button class="tcard" onclick="openTrack(\''+t+'\')"><span class="ic">'+TR[t].c+'</span><span style="flex:1"><b>'+TR[t].n+'</b><br><span class="mut">'+TR[t].d+'</span><div class="pb"><i style="width:'+(tot?n/tot*100:0)+'%"></i></div><span class="mut">'+n+" / "+tot+" ejercicios</span></span></button>"});
  h+=nav();
 }else if(S.v=="profile"){
  h=hud()+'<h1>JUGADOR</h1><div class="card"><p>'+esc(U.email)+"</p><p>⭐ "+xp()+" XP</p><p>🔥 Racha: "+streak()+' días</p></div><button class="btn ghost" onclick="logout()">SALIR</button>'+nav();
 }else if(S.v=="path"){
  F=flat(S.t);c=0;var cur=curI(S.t),ct=F[cur],off=[0,36,56,36,0,-36,-56,-36];
  h=hud()+'<div class="ban"><div><small>'+TR[S.t].L[ct.l].n.toUpperCase()+" · TEMA "+(cur+1)+"</small><b>"+ct.x.t+'</b></div><button class="bk" onclick="openT('+cur+')">📖</button></div>';
  TR[S.t].L.forEach(function(L,li){h+='<div class="lvb lv'+li+'">NIVEL '+(li+1)+" · "+L.n.toUpperCase()+"</div>";
   if(!L.T.length){h+='<p class="soon">PRÓXIMAMENTE…</p>';return}
   h+='<div class="path">';
   L.T.forEach(function(T){var i=c++,k=F[i].k,d=done(S.t,k)>=T.ex.length,u=unlocked(S.t,i),isC=i==cur&&!d;
    h+='<div class="nd" style="transform:translateX('+off[i%8]+'px)">'+(isC?'<div class="go">¡EMPIEZA!</div>':"")+'<button class="dot'+(d?" done":isC?" cur":u?"":" lock")+'" '+(u?'onclick="openT('+i+')"':"disabled")+">"+(d?"★":u?i+1:"🔒")+'</button><div class="cap">'+T.t+"<br><small>"+Math.min(done(S.t,k),T.ex.length)+"/"+T.ex.length+"</small></div></div>"});
   var all=L.T.every(function(T,j){return done(S.t,li+"-"+j)>=T.ex.length});
   h+='<div class="nd"><div class="chest'+(all?" open":"")+'">'+(all?"🎁":"📦")+"</div></div></div>"});
  h+=nav();
 }else if(S.v=="lesson"){t=TP().x;
  h='<div class="top"><button class="back" onclick="go(\'path\')">←</button><h2 style="margin:0">'+t.t+'</h2></div><div class="card"><p>'+t.e+'</p><p class="mut">Ejemplo:</p><pre>'+hl(t.ej)+"</pre>"+(S.t=="py"?'<p class="mut">Salida:</p><pre>'+esc(t.out)+"</pre>":"")+"</div>"+(S.t=="sql"?ver():"")+'<button class="btn" onclick="startEx()">Empezar ejercicios</button>';
 }else if(S.v=="ex"){t=TP().x;var x=t.ex[S.e];
  h='<div class="top"><button class="back" onclick="go(\'path\')">✕</button><div class="bar"><i style="width:'+(S.e/t.ex.length*100)+'%"></i></div></div><h2>'+x.p+"</h2>"+(S.t=="sql"?ver():'<p class="mut">Salida esperada:</p><pre>'+esc(x.out)+'</pre><p id="pyst" class="mut"></p>');
  if(x.tpl){h+='<div class="card q">'+x.tpl.split("\n").map(function(ln){var u=ln.split("___");return"<div>"+hl(u[0])+(u.length>1?'<span class="inl"><pre class="hl"></pre><input class="blank" autocomplete="off" autocapitalize="off" spellcheck="false" oninput="sync(this)"></span>'+hl(u[1]):"")+"</div>"}).join("")+"</div>"}
  else h+='<div class="ed"><pre class="hl"></pre><textarea id="in" placeholder="'+(S.t=="sql"?"Escribe tu consulta SQL (el ; final es opcional)":"Escribe tu código Python (usa espacios para la sangría)")+'" autocapitalize="off" spellcheck="false" oninput="sync(this)" onscroll="this.previousSibling.scrollTop=this.scrollTop"></textarea></div>';
  if(S.t=="sql"&&db&&!x.tpl){var e=run(x.sol);h+='<p class="mut">Resultado esperado:</p>'+tbl(e.columns,e.values)}
  h+='<div id="fb"></div><button id="go" class="btn" onclick="comprobar()">Comprobar</button>';
 }else{t=TP().x;F=flat(S.t);
  h='<div class="big">🎉</div><h1 style="text-align:center">¡Tema completado!</h1><p class="mut" style="text-align:center">Terminaste «'+t.t+"».</p>"+(S.f+1<F.length?'<button class="btn" onclick="openT('+(S.f+1)+')">Siguiente tema</button>':"")+'<button class="btn ghost" onclick="go(\'path\')">Volver al mapa</button>'}
 a.innerHTML=h;window.scrollTo(0,0);if(S.v=="ex"&&S.t=="py")pyMsg()}
function go(v){S.v=v;render()}
function openTrack(t){S.t=t;S.v="path";if(t=="py")loadPy();render()}
function openT(i){S.f=i;S.v="lesson";render()}
function startEx(){var t=TP(),n=done(S.t,t.k),l=t.x.ex.length;S.e=n>=l?0:n;S.v="ex";render()}
function comprobar(){
 var t=TP(),x=t.x.ex[S.e],Fs=[].slice.call(document.querySelectorAll("#in,.blank")),vs=Fs.map(function(i){return i.value});
 if(vs.some(function(v){return!v.trim()}))return;
 var k=0,c=x.tpl?x.tpl.replace(/___/g,function(){return vs[k++].trim()}):vs[0],f=document.getElementById("fb"),b=document.getElementById("go"),r=S.t=="sql"?checkSql(c,x):checkPy(c,x);
 if(r.wait){f.innerHTML='<div class="fb bad"><p>Python todavía está cargando. Espera unos segundos e inténtalo de nuevo.</p></div>';return}
 Fs.forEach(function(i){i.disabled=true});
 if(r.ok){f.innerHTML='<div class="fb ok"><strong>¡CORRECTO!</strong>'+(done(S.t,t.k)<=S.e?'<span class="xp">+10 XP</span>':"")+'<p>'+x.why+"</p></div>";b.textContent="Continuar";b.onclick=next;
  bump();if(done(S.t,t.k)<=S.e)saveP(S.t,t.k,S.e+1)}
 else{f.innerHTML='<div class="fb bad shake"><strong>'+(r.err?"Tu código tiene un error":"Todavía no")+"</strong>"+(r.err?"<p>"+esc(r.err)+"</p>":"")+(r.got!=null&&!r.err?"<p>Tu código mostró:</p><pre>"+esc(r.got||"(nada)")+"</pre>":"")+"<p>Respuesta correcta:</p><pre>"+hl(S.t=="sql"?fmt(x.sol):x.sols[0])+"</pre><p>"+x.why+"</p><p>Inténtalo de nuevo.</p></div>";b.textContent="Intentar de nuevo";b.onclick=function(){Fs.forEach(function(i){i.disabled=false;i.value="";sync(i)});f.innerHTML="";b.textContent="Comprobar";b.onclick=comprobar;Fs[0].focus()}}
 f.scrollIntoView({behavior:"smooth",block:"nearest"})}
function next(){if(S.e+1<TP().x.ex.length){S.e++;render()}else go("end")}
if(window.initSqlJs){initSqlJs().then(function(q){db=new q.Database();db.run(SEED)}).catch(function(){})}
